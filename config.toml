# adres url, pod którym będzie budowana strona
base_url = "https://realeteryu.github.io/eteryu.space/"
title = "Eteryu.space"
description = "Blog o cyfrowej higienie, prywatności i bezpieczeństwie"
author = "Eteryu"
theme = "futu"

# automatyczna kompilacja plików sass
compile_sass = true
# generowanie kanałów rss/atom
generate_feeds = true
feed_filenames = ["index.xml"]

# zachowuje daty w adresach url (tak jak w oryginalnym motywie)
[slugify]
paths_keep_dates = true

[markdown]
# renderowanie emoji w treści
render_emoji = true
# przypisy na dole strony
bottom_footnotes = true

# poprawiona składnia podświetlania kodu dla nowszych wersji zoli
[markdown.highlighting]
theme = "github-light"

# tutaj umieść swoje własne zmienne
[extra]
# poprawia wersję wyświetlaną w stopce
zola_version = "0.23.6"

# teksty interfejsu
latest_posts_title = "Ostatnie wpisy"
view_all_text = "Zobacz wszystkie →"

# formaty daty
date_locale = "pl_PL"
date_format_home = "%d %B %Y"
date_format_posts = "%d %B"

# przykładowa nawigacja
[[extra.nav]]
name = "Strona główna"
url = "@/_index.md"

[[extra.nav]]
name = "Wpisy"
url = "@/posts/_index.md"
